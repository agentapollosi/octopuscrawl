[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/web", "crates/crawler", "crates/ingest", "crates/queen"]
# `cargo build` at the root builds only the backend crates; the web crate is a
# wasm target built by trunk, and the crawler (heavy: chromiumoxide) builds on
# demand with `-p octopuscrawl-crawler`.
default-members = ["crates/core", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
octopuscrawl-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
