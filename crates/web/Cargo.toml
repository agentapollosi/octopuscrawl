[package]
name = "octopuscrawl-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
octopuscrawl-core.workspace = true
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-net = { version = "0.6", features = ["websocket", "http"] }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
console_error_panic_hook = "0.1"
chrono = { workspace = true }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "HtmlImageElement", "CanvasRenderingContext2d", "EventTarget", "KeyboardEvent",
  "Location", "CanvasGradient",
] }
